name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        run: npm install
        working-directory: Backend

      - name: Lint backend
        run: npm run lint
        working-directory: Backend

      - name: Install frontend dependencies
        run: npm install
        working-directory: Frontend

      - name: Build frontend
        run: npm run build
        working-directory: Frontend
        env:
          REACT_APP_API_URL: http://localhost:3000

  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inova_user
          POSTGRES_PASSWORD: inova_pass
          POSTGRES_DB: inova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://inova_user:inova_pass@localhost:5432/inova_test
      JWT_SECRET: ci_test_secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        run: npm install
        working-directory: Backend

      - name: Run backend tests
        run: npm test
        working-directory: Backend
